<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalo1ng · 内置 PV 播放器</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111a17;color:#fff;font:13px system-ui,sans-serif}body{display:flex;flex-direction:column}.screen{position:relative;flex:1;min-height:0}video{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:contain;background:#050907}footer{display:flex;align-items:center;gap:12px;padding:7px 12px;background:#18251f;min-height:42px}label{display:flex;align-items:center;gap:6px;white-space:nowrap}select,button{font:inherit;color:#fff;background:#293e34;border:1px solid #52685c;border-radius:5px;padding:4px 7px}button{cursor:pointer}#status{flex:1;color:#c0d7c9;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#notice{z-index:3;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:85%;text-align:center;line-height:1.8;background:#15231edb;border-radius:10px;padding:12px;pointer-events:none}#notice:empty{display:none}@media(max-width:450px){footer{gap:6px;padding:5px;font-size:11px}#status{display:none}select{max-width:130px}}
#danmaku{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}.dm-options{position:absolute;bottom:45px;left:5px;background:#17202fee;color:white;padding:14px;border:1px solid #526582;border-radius:12px;z-index:5;display:grid;gap:10px;width:260px}.dm-options input[type=range]{width:150px}summary{cursor:pointer}footer{flex-wrap:wrap}#dm-status{font-size:11px;color:#c6d8e9}
/* All menus stay within the HTML surface captured by Windows WebView. */
select[hidden],.choice-menu[hidden]{display:none!important}.choice-trigger{display:inline-flex;align-items:center;gap:10px;min-height:30px;white-space:nowrap}.choice-trigger::after{content:'▾';font-size:10px;margin-left:auto}.choice-trigger:disabled{opacity:.5;cursor:wait}.choice-menu{position:fixed;z-index:1000;display:grid;gap:3px;max-width:calc(100vw - 16px);overflow-y:auto;padding:6px;background:#192c25;border:1px solid #6b8979;border-radius:9px;box-shadow:0 8px 30px #0009}.choice-menu button{text-align:left;padding:9px 12px;border:0;background:transparent;white-space:nowrap}.choice-menu button:hover,.choice-menu button:focus-visible{background:#3a5c4b;outline:2px solid #94e8cd;outline-offset:-2px}.choice-menu [aria-selected=true]{background:#2b4b3a;color:#b3f5d8}.choice-trigger:focus-visible{outline:2px solid #94e8cd;outline-offset:2px}

@media(max-width:600px){footer{gap:7px;padding:8px;font-size:12px;flex-shrink:0}footer button{min-height:34px}.choice-trigger{min-height:34px}video{object-fit:contain}.dm-options{position:fixed;bottom:100px;max-width:calc(100vw - 16px);max-height:calc(100vh - 110px);overflow:auto}#notice{font-size:12px;padding:8px}}
.dm-state{order:1;display:flex;align-items:center;gap:8px;flex:1 0 100%;min-width:0;border-top:1px solid #ffffff1f;padding-top:5px}.dm-state #dm-status{flex:1;min-width:0;white-space:normal;line-height:1.4}.dm-state button{font-size:11px;flex-shrink:0;padding:4px 7px}
</style><script src="/vendor/dash.all.min.js" defer></script><script src="/player.js" defer></script></head>
<body><div class="screen"><canvas id="danmaku" aria-hidden="true"></canvas><video controls playsinline preload="metadata" aria-label="B 站 PV 视频"></video><div id="notice" role="status">正在加载 PV…</div></div><footer><label><input id="dm-toggle" type="checkbox">弹幕</label><details id="dm-settings"><summary>设置</summary><div class="dm-options"><label>字号<input id="dm-size" type="range" min="14" max="36" value="23"></label><label>透明<input id="dm-opacity" type="range" min="20" max="100" value="80"></label><label>速度<input id="dm-speed" type="range" min="4" max="14" value="8"></label><label>密度<input id="dm-density" type="range" min="2" max="12" value="6"></label><label>区域<select id="dm-area"><option value="0.5">半屏</option><option value="0.75">3/4 屏</option><option value="1">全屏</option></select></label><label><input id="dm-mono" type="checkbox">纯白</label></div></details><span id="status" role="status">内置播放器 · B 站</span><label>画质<select id="quality" aria-label="画质" disabled></select></label><label>倍速<select id="speed" aria-label="倍速"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><button id="retry" type="button" aria-label="重试播放">重试</button><button id="compatible" type="button">兼容播放</button><div class="dm-state"><span id="dm-status" role="status">弹幕等待视频信息…</span><button id="dm-retry" type="button">重新加载弹幕</button></div></footer></body></html>
