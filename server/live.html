<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalo1ng · 直播展示</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:white;width:100%;height:100%;font-family:system-ui,sans-serif}body{display:grid;place-items:center;overflow:hidden}#widget{width:min(95vw,1000px);display:flex;align-items:center;gap:28px;padding:30px;border-radius:24px;transition:opacity .3s;color:var(--ink);font-size:var(--size);background:rgba(15,19,28,var(--opacity));text-shadow:0 2px 8px #0009}#cover{width:160px;height:160px;object-fit:cover;border-radius:18px;flex-shrink:0}#body{flex:1;min-width:0;text-align:var(--align)}#title{font-size:.65em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#artist{font-size:.4em;opacity:.65;margin-top:5px}#line{font-weight:800;line-height:1.6;margin:14px 0 0;overflow-wrap:anywhere}#translation{font-size:.57em;line-height:1.6;opacity:.8}#next,#previous{font-size:.6em;opacity:.35;line-height:1.8}#bar{height:3px;margin-top:18px;background:#ffffff30;border-radius:8px;overflow:hidden}#progress{height:100%;width:0;background:currentColor;transition:width .4s linear}#time{font-size:.35em;opacity:.6;margin-top:5px}.mode1 #cover,.mode2 #cover,.mode3 #cover{display:none}.mode1 #title,.mode1 #artist,.mode1 #bar,.mode1 #time,.mode2 #title,.mode2 #artist,.mode2 #bar,.mode2 #time{display:none}.mode0 #next,.mode0 #previous,.mode1 #next,.mode1 #previous,.mode3 #next,.mode3 #previous{display:none}.mode2 #line{font-size:1.3em}.mode2 #body{mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}.mode3{border-left:5px solid var(--ink);border-radius:4px!important}.mode4 #cover{border-radius:50%;animation:spin 20s linear infinite}.mode4.paused #cover{animation-play-state:paused}.mode4 #previous,.mode4 #next{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mode5{flex-direction:column;max-width:420px}.mode5 #cover{width:min(55vw,240px);height:auto;aspect-ratio:1}.mode5 #next,.mode5 #previous{display:none}
.mode6 #cover,.mode7 #cover,.mode8 #cover,.mode11 #cover{display:none}.mode6 #line{-webkit-text-stroke:1px var(--ink);color:transparent;text-shadow:none;font-size:1.5em}
.mode6 #previous,.mode6 #next,.mode7 #previous,.mode7 #next,.mode8 #previous,.mode8 #next,.mode9 #previous,.mode9 #next,.mode10 #previous,.mode10 #next,.mode11 #previous,.mode11 #next{display:none}
.mode7{border-radius:0!important;box-shadow:10px 10px 0 #ffffff24;border-left:10px solid currentColor}.mode7 #line{letter-spacing:.08em}
.mode8{border:2px solid currentColor;box-shadow:0 0 25px color-mix(in srgb,var(--ink),transparent 60%)}.mode8 #line{text-shadow:0 0 16px var(--ink)}
.mode9{border-radius:55px!important;border:1px solid #ffffff70}.mode9 #cover{width:100px;height:100px;border-radius:50%;border:10px solid #ffffff20}
.mode10{backdrop-filter:blur(18px);border:1px solid #ffffff60;box-shadow:0 12px 50px #0003}.mode10 #cover{border-radius:8px;transform:rotate(-5deg)}
.mode11{padding:12px 20px!important;border-radius:0!important}.mode11 #title{font-size:.5em}.mode11 #line{font-size:.8em}.mode11 #translation{font-size:.45em}.mode11 #bar{height:6px}
#tools{display:none;position:fixed;right:8px;top:8px;z-index:2;background:#151923bb;color:white;border:1px solid #ffffff55;border-radius:9px;padding:8px;font:12px system-ui}
.interactive #tools{display:block}.interactive #widget{position:absolute;resize:both;overflow:auto;min-width:220px;min-height:100px;max-width:100vw;max-height:100vh;cursor:move;touch-action:none}.interactive.locked #widget{resize:none;cursor:default;touch-action:auto}
@media(max-width:600px){#widget{gap:12px;padding:16px}#cover{width:70px;height:70px}#line{font-size:min(1em,8vw)}}
</style></head><body><button id="tools" type="button">锁定位置</button><section id="widget" hidden><img id="cover" alt=""><div id="body"><div id="title"></div><div id="artist"></div><div id="previous"></div><div id="line"></div><div id="translation"></div><div id="next"></div><div id="bar"><div id="progress"></div></div><div id="time"></div></div></section><script src="/live.js"></script></body></html>
