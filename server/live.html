<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalo1ng · 直播展示</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:white;width:100%;height:100%;font-family:system-ui,sans-serif}body{display:grid;place-items:center;overflow:hidden}#widget{width:min(95vw,1000px);display:flex;align-items:center;gap:28px;padding:30px;border-radius:24px;transition:opacity .3s;color:var(--ink);font-size:var(--size);background:rgba(15,19,28,var(--opacity));text-shadow:0 2px 8px #0009}#cover{width:160px;height:160px;object-fit:cover;border-radius:18px;flex-shrink:0}#body{flex:1;min-width:0;text-align:var(--align)}#title{font-size:.65em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#artist{font-size:.4em;opacity:.65;margin-top:5px}#line{font-weight:800;line-height:1.6;margin:14px 0 0;overflow-wrap:anywhere}#translation{font-size:.57em;line-height:1.6;opacity:.8}#next,#previous{font-size:.6em;opacity:.35;line-height:1.8}#bar{height:3px;margin-top:18px;background:#ffffff30;border-radius:8px;overflow:hidden}#progress{height:100%;width:0;background:currentColor;transition:width .4s linear}#time{font-size:.35em;opacity:.6;margin-top:5px}.mode1 #cover,.mode2 #cover,.mode3 #cover{display:none}.mode1 #title,.mode1 #artist,.mode1 #bar,.mode1 #time,.mode2 #title,.mode2 #artist,.mode2 #bar,.mode2 #time{display:none}.mode0 #next,.mode0 #previous,.mode1 #next,.mode1 #previous,.mode3 #next,.mode3 #previous{display:none}.mode2 #line{font-size:1.3em}.mode2 #body{mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}.mode3{border-left:5px solid var(--ink);border-radius:4px!important}.mode4 #cover{border-radius:50%;animation:spin 20s linear infinite}.mode4.paused #cover{animation-play-state:paused}.mode4 #previous,.mode4 #next{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><section id="widget" hidden><img id="cover" alt=""><div id="body"><div id="title"></div><div id="artist"></div><div id="previous"></div><div id="line"></div><div id="translation"></div><div id="next"></div><div id="bar"><div id="progress"></div></div><div id="time"></div></div></section><script src="/live.js"></script></body></html>
