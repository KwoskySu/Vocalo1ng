name: vocashelf
description: A personal Vocaloid listening journal and discovery companion.
publish_to: none
version: 0.4.10+4018
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  file_selector: ^1.0.3
  share_plus: ^12.0.1
  media_kit: ^1.2.0
  media_kit_libs_audio: ^1.0.5
  qr_flutter: ^4.1.0
  http: ^1.5.0
  html: ^0.15.6
  flutter_widget_from_html_core: ^0.17.0
  web: ^1.1.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
  webview_windows: ^0.4.0
  flutter_svg: 2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/fonts/OFL.txt
    - assets/fonts/NotoSerifSC-OFL.txt
    - assets/fonts/ZCOOLKuaiLe-OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe.ttf
